name: frontend-ci

on:
  push:
    branches: [dev, main]
    paths:
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.html'
      - 'frontend/src/**/*.css'
      - 'frontend/package.json'
      - '!frontend/**/*.md'
  pull_request:
    branches: [dev, main]
    paths:
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.html'
      - 'frontend/src/**/*.css'

jobs:
