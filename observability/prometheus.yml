global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-actuator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend-api:8087']
        labels:
          application: 'backend-api'
  
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']