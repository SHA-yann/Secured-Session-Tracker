server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Collecte Globale des Conteneurs Docker (Front, Back, Nginx, etc.)
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s

    relabel_configs:
      # Nettoie le nom du conteneur (ex: '/backend-api' -> 'backend-api')
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Récupère le nom du service Docker Compose s'il existe
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

  # 2. Pipeline d'extraction des paramètres de Production pour Spring Boot
    pipeline_stages:
      # Extrait le niveau de sévérité (INFO, WARN, ERROR) des logs Spring Boot
      - regex:
          expression: '(?P<level>INFO|WARN|ERROR|DEBUG|TRACE)'
      - labels:
          level: