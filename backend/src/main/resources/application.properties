
spring.config.import=optional:file:.env[.properties]
spring.application.name=API-Security-PoC

# management config
management.server.port=8087
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.observations.key-values.application=${spring.application.name}

#database config
spring.datasource.url=jdbc:postgresql://localhost:5432/usermanagement
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.format_sql=true


#application config
server.port=8080
jwt.secret =${JWT_SECRET}
jwt.expiration =3600000
refresh.expiration-days =7
security.cookie.domain=localhost
security.cookie.secure=false  

# redis config
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
#spring.data.redis.lettuce.shutdown-timeout=