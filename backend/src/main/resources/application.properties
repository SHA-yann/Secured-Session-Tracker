# application config
spring.config.import=optional:file:.env[.properties]
spring.application.name=Secured-Session-Tracking
server.port=8080
jwt.secret =${JWT_SECRET}
jwt.expiration =1800000
refresh.expiration-days =7
security.cookie.domain=localhost
security.cookie.secure=false

# voir ce que Netty fait exactement sur le reseau
logging.level.reactor.netty.http.server.HttpServer=DEBUG

# management config
management.server.port=8087
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.observations.key-values.application=${spring.application.name}

# database config
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/usermanagement}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true

# redis config
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password==${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.lettuce.pool.max-active=${POOL_MAX_ACTIVE:8}
spring.data.redis.lettuce.pool.max-idle=${POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${POOL_MIN_IDLE:0}
spring.data.redis.timeout=1000ms
#spring.data.redis.lettuce.shutdown-timeout=