apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: default
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
      annotations:
        # Indispensable pour que Prometheus trouve votre API automatiquement
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8087"
    spec:
      containers:
      - name: api-container
        image: api:v1.0.0  # Nom de l'image que vous allez build
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
           name: api-config
        ports:
        - containerPort: 8080
        - containerPort: 8087
        resources:
         requests:
          memory: "256Mi"
          cpu: "500m"
         limits:
          memory: "500Mi"
          cpu: "800m"
        startupProbe:
         httpGet:
           path: /actuator/health
           port: 8087
         initialDelaySeconds: 15
         failureThreshold: 6
         periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
  labels:
    app: api-service # <--- Doit matcher le label de votre Deployment
spec:
  type: loadBalancer
  selector:
    app: api-service
  ports:
    - name: http-api
      port: 8080
      targetPort: 8080
    - name: prometheus
      port: 8087
      targetPort: 8087
  type: LoadBalancer # Permet d'accéder à l'API via localhost:8080 sur Windows
