apiVersion: apps/v1
kind: Deployment
metadata:
 name: postgres-db
spec:
 replicas: 1
 strategy:
  type: Recreate
 selector:
  matchLabels:
   app: db-service
 template:
  metadata:
   labels:
    app: db-service
  spec:
   containers:
   - name: postgres
     image: postgres:17
     imagePullPolicy: IfNotPresent
     volumeMounts:
      - name: postgres-storage
        mountPath: /var/lib/postgresql/data
     resources:
      requests:
       memory: "256Mi"
       cpu: "200m"
      limits:
       memory: "500Mi"
       cpu: "400m"
     startupProbe:
      exec:
       command:
       - pg_isready
       - -U
       - umuser
      failureThreshold: 6
      periodSeconds: 5
     ports:
     - containerPort: 5432
     envFrom:
     - configMapRef:
        name: api-config
   volumes:
   - name: postgres-storage
     persistentVolumeClaim:
      claimName: postgres-pvc

---

apiVersion: v1
kind: Service
metadata:
 name: postgres-service
spec:
 selector:
  app: db-service
 ports:
 - protocol: TCP
   port: 5432
   targetPort: 5432