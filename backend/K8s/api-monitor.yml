apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-monitor
  namespace: monitoring
  labels:
    release: kube-stack # <--- Ce label doit matcher celui de votre installation Prometheus
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: api-service # <--- Doit matcher le label de votre SERVICE API
  endpoints:
  - port: prometheus # Nom du port défini dans votre Service API
    path: /actuator/prometheus
    interval: 15s
    