<div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4">

  <div class="group p-4 bg-white border border-gray-100 rounded-2xl shadow-sm hover:border-blue-200 transition-all duration-300">
    <div class="flex items-center gap-3 mb-2">
      <div class="p-2 bg-blue-50 rounded-lg text-blue-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      </div>
      <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Member since</span>
    </div>
    <p class="text-sm font-semibold text-gray-800">{{ formattedCreation() }}</p>
    <p class="text-[10px] text-gray-400 mt-1">By : <span class="text-blue-500">{{ createdBy() || 'Système' }}</span></p>
  </div>

  <div class="group p-4 bg-white border border-gray-100 rounded-2xl shadow-sm hover:border-emerald-200 transition-all duration-300">
    <div class="flex items-center gap-3 mb-2">
      <div class="p-2 bg-emerald-50 rounded-lg text-emerald-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </div>
      <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Last update</span>
    </div>
    <p class="text-sm font-semibold text-gray-800">{{ formattedUpdate() }}</p>
    <p class="text-[10px] text-gray-400 mt-1">Author : <span class="text-emerald-500">{{ updatedBy() || 'N/A' }}</span></p>
  </div>

  @if(auth.isAdmin() || isSelf()){
    <div class="col-span-1 md:col-span-2 p-3 bg-gray-50 border border-dashed border-gray-200 rounded-xl flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-[10px] font-mono text-gray-500 uppercase">UserID</span>
        <span class="text-xs font-mono font-bold text-gray-700 bg-white px-2 py-0.5 rounded border border-gray-100 shadow-sm">
        #{{ userId() }}
        </span>
      </div>

      @if (auth.isAdmin()){
        @if(!status().startsWith('IN') ) {
          <button (click)="onDisableUser(userId())" [disabled]="isProcessing()"
          class="text-[10px] uppercase font-bold text-red-600 hover:text-red-700 transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1">

          @if (isProcessing()) {
            <span class="animate-pulse">Processing...</span>
          } @else {
            <span>{{deletionButtonText()}}</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728L5.636 5.636" />
            </svg>
          }
          </button>
        }@else{
          <button (click)="onEnableUser(userId())" [disabled]="isProcessing()"
          class="text-[10px] uppercase font-bold text-red-600 hover:text-red-700 transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1">

          @if (isProcessing()) {
            <span class="animate-pulse">Processing...</span>
          } @else {
            <span>{{deletionButtonText()}}</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728L5.636 5.636" />
            </svg>
          }
          </button>
        }
      }
    </div>
  }

</div>
