<nav class="h-full px-4 md:px-8 flex items-center justify-between gap-4 md:gap-8">
  <div class="flex items-center gap-3 cursor-pointer shrink-0">
    <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-200">
      <span class="text-white font-bold text-xl">SST</span>
    </div>
    <div class="hidden sm:flex flex-col">
      <span class="font-bold text-slate-900 leading-none">Secured</span>
      <span class="text-[9px] text-blue-500 font-black uppercase tracking-tighter">Session Tracker</span>
    </div>
  </div>

  <div class="hidden lg:flex items-center gap-8">
    <a routerLink="/dashboard" class="text-sm font-bold text-slate-500 hover:text-blue-600 transition-all">Overview</a>
    <a routerLink="/login" class="text-sm font-bold text-slate-400 hover:text-blue-600">Login</a>
  </div>

  <div class="flex items-center gap-2 md:gap-4">
    @if(currentUserId() && isAuthenticated()){
      <app-user-avatar 
          [username]="auth.username() || ''" 
          class="shadow-2xl shadow-blue-500/20 rounded-2xl">
      </app-user-avatar>
    }

    <button (click)="handleLogAction()" 
      class="px-4 py-2 text-xs font-black uppercase tracking-widest rounded-xl transition-all active:scale-95 shadow-sm"
      [ngClass]="isAuthenticated() ? 'text-red-500 bg-red-50 hover:bg-red-100' : 'text-white bg-blue-600 hover:bg-blue-700 shadow-blue-200'">
      {{ isAuthenticated() ? 'Sign out' : 'Sign in' }}
    </button>
  </div>
</nav>
