<div class="flex flex-col h-screen w-full bg-slate-100 overflow-hidden p-2 md:p-4 gap-2 md:gap-4">

  <header class="w-full bg-white rounded-2xl shadow-sm z-50 shrink-0 overflow-hidden flex flex-col">
    <app-nav-bar class="w-full h-16 block" ></app-nav-bar>
    <app-infos-ticker></app-infos-ticker>
  </header>

  <div class="flex md:flex-row flex-1 gap-1 md:gap-2 overflow-hidden">

    <aside class="flex md:w-70 md:flex-col lg:w-80 h-full min-h-0 rounded-2xl bg-white shadow-md overflow-hidden">
      <app-user-list></app-user-list>
    </aside>

    <main class="flex-1 flex flex-col bg-transparent overflow-y-auto min-h-0">
      @if (selectedUser()) {
        <div class="animate-in fade-in slide-in-from-bottom-4 duration-500 h-full">
          <app-user-details-view ></app-user-details-view>
        </div>
      } @else {
        <div class="flex flex-col items-center justify-center h-full text-slate-400 bg-white rounded-3xl shadow-sm">
          <i class="ri-user-search-line text-6xl mb-4 opacity-20"></i>
          <p class="text-sm font-medium italic">Select a user to access details</p>
        </div>
      }
    </main>
  </div>
</div>
