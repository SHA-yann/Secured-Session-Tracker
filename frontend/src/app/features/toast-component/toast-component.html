<div class="fixed top-5 right-5 z-30 flex flex-col gap-2 pointer-events-none">
    @for(n of notify.notifications(); track n.id) {
        <div [class]="getNotificationClass(n.type)" class="pointer-events-auto animate-in slide-in-from-right fade-in" >
            <div class="flex-1 font-medium">
                {{n.message}}
            </div>
            <button type="button" (click)="notify.remove(n.id)" class="ml-4 text-xl leading-none hover:opacity-70 transition-opacity" aria-label="Fermer">&times;</button>
        </div>
    }
</div>
