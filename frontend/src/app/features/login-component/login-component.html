<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-md">

    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-gray-800">Welcome</h2>
      <p class="text-gray-500 text-sm">Sign in to access dashboard</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Username</label>
        <input formControlName="username" type="text" 
          class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Password</label>
        <input formControlName="password" type="password" 
          class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-blue-500 outline-none">
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading()"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors disabled:bg-gray-300">
        {{ isLoading() ? 'Identifying...' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
