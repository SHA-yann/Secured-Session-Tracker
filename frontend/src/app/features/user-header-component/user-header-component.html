
<div class="flex items-center p-6 gap-6 bg-white">

  <div class="flex-1 flex flex-col min-w-0">
    <div class="flex items-center gap-3">
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight truncate">
        {{ username() }}
      </h1>
      @if(auth.isAdmin() || isSelf()){
        <span  
          [class]="role().includes('ADMIN') 
            ? 'bg-blue-50 text-blue-700 border-blue-200' 
            : 'bg-slate-100 text-slate-600 border-slate-200'"
          class="px-2.5 py-0.5 rounded-md text-[10px] font-black uppercase tracking-wider border">
          {{ role() }}
        </span>
      }
    </div>

    @if(auth.isAdmin() || isSelf()){
      <p class="text-sm text-slate-500 font-medium mt-1">{{ email() }}</p>
    }
  </div>

  @if(auth.isAdmin() || isSelf()){
    <div class="flex items-center gap-2.5 px-4 py-2 bg-slate-50 rounded-lg border border-slate-200 shadow-sm">
      <span 
        class="w-2.5 h-2.5 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.2)]"
        [style.backgroundColor]="status() === 'ACTIVE' ? '#10b981' : '#94a3b8'">
      </span>
      <span class="text-[11px] font-extrabold text-slate-700 uppercase tracking-widest">
        {{ status() }}
      </span>
    </div>
  }
</div>
